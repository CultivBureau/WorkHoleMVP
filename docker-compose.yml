services:
  frontend:
    image: ${DOCKER_USERNAME}/rwafi-workhole:main
    container_name: rwafi-workhole
    ports:
      - "3002:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VITE_API_URL=${VITE_API_URL}
    env_file:
      - .env
    networks:
      - workholebackend_workhole-network

networks:
  workholebackend_workhole-network:
    external: true
